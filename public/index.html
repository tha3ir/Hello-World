<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام تشغيل الأعمال</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2342;--steel:#51647A;--red:#DA291C;--silver:#B9C2CC;--ink:#0A0F16;--light:#EEF1F5;--pale:#F7F9FB;--green:#1F7A3D;--amber:#B45309}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;color:var(--ink);background:var(--pale);font-size:14px}
h1,h2,h3,.brand{font-family:'Cairo',sans-serif}
#app{display:flex;min-height:100vh}
/* الشريط الجانبي */
#side{width:215px;background:var(--navy);color:#fff;padding:14px 0;flex-shrink:0}
#side .brand{padding:0 16px 10px;border-bottom:2px solid var(--red);margin-bottom:8px}
#side .brand h1{font-size:16px;font-weight:800}
#side .brand small{color:var(--silver);font-size:11px}
.navgrp{padding:8px 16px 2px;font-size:10.5px;color:var(--silver);letter-spacing:.5px}
.navbtn{display:block;width:100%;text-align:right;background:none;border:none;color:#dfe6ee;padding:7px 16px;font-family:inherit;font-size:13px;cursor:pointer;border-right:3px solid transparent}
.navbtn:hover{background:rgba(255,255,255,.07)}
.navbtn.active{background:rgba(218,41,28,.18);border-right-color:var(--red);color:#fff;font-weight:700}
#main{flex:1;padding:18px 22px;max-width:1150px}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:8px}
.pagehead h2{color:var(--navy);font-size:19px}
.pagesub{color:var(--steel);font-size:12px;margin-bottom:14px}
.redline{height:3px;background:var(--red);margin:6px 0 14px;border-radius:2px}
/* بطاقات KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--silver);border-radius:10px;padding:12px 14px}
.kpi .lbl{font-size:11.5px;color:var(--steel);font-weight:700}
.kpi .val{font-family:'Cairo';font-size:22px;font-weight:800;color:var(--navy);margin-top:4px}
.kpi.warn .val{color:var(--red)}
.kpi.good .val{color:var(--green)}
/* جداول */
.card{background:#fff;border:1px solid var(--silver);border-radius:10px;padding:14px;margin-bottom:16px}
.card h3{color:var(--navy);font-size:14.5px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--navy);color:#fff;padding:7px 8px;text-align:right;font-size:11.5px;white-space:nowrap}
td{border-bottom:1px solid var(--light);padding:6px 8px;vertical-align:middle}
tr:nth-child(even) td{background:var(--pale)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#eef3fa}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.tag.ok{background:#e6f4ea;color:var(--green)}
.tag.warn{background:#fdecea;color:var(--red)}
.tag.mid{background:#fef3e2;color:var(--amber)}
.tag.info{background:var(--light);color:var(--steel)}
.alertbox{background:#fdecea;border-right:4px solid var(--red);color:var(--red);font-weight:700;padding:8px 12px;border-radius:6px;margin:8px 0;font-size:12.5px}
/* نماذج */
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px;margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--steel);font-weight:700;margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--silver);border-radius:6px;font-family:inherit;font-size:13px;background:#fff}
.fld input:focus,.fld select:focus{outline:2px solid var(--navy)}
.fld input[readonly]{background:var(--light);color:var(--navy);font-weight:700}
.btn{background:var(--navy);color:#fff;border:none;padding:8px 18px;border-radius:7px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.9}
.btn.red{background:var(--red)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.sm{padding:4px 10px;font-size:11.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.linestable input,.linestable select{width:100%;padding:5px 6px;border:1px solid var(--silver);border-radius:5px;font-family:inherit;font-size:12.5px}
.totrow{display:flex;justify-content:flex-start;gap:22px;background:var(--light);padding:9px 12px;border-radius:7px;margin-top:8px;font-weight:700;font-size:13px;flex-wrap:wrap}
.totrow b{color:var(--navy)}
.empty{color:var(--steel);text-align:center;padding:18px;font-size:13px}
.searchbar{padding:7px 10px;border:1px solid var(--silver);border-radius:7px;font-family:inherit;width:230px}
/* الطباعة */
#printdoc,.pdblock{background:#fff;border:1px solid var(--silver);border-radius:10px;padding:26px;max-width:820px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ph .logo{border:1px solid var(--silver);color:var(--silver);width:95px;height:60px;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:6px}
.ph .co{text-align:center;flex:1}
.ph .co .n1{font-family:'Cairo';font-weight:800;color:var(--navy);font-size:17px}
.ph .co .n2{color:var(--steel);font-size:11px}
.ph .meta{font-size:11px;border:1px solid var(--silver);border-radius:6px;padding:6px 9px;min-width:190px}
.ph .meta b{color:var(--red)}
.pline{height:3px;background:var(--red);margin:10px 0}
.ptitle{text-align:center;font-family:'Cairo';font-weight:800;color:var(--navy);font-size:17px;margin-bottom:12px}
/* ترويسة موحّدة لكل المستندات القابلة للطباعة: شعار+اسم الشركة (يمين) — عنوان المستند (وسط) — QR السجل التجاري (يسار) */
.phdr{display:flex;justify-content:space-between;align-items:center;direction:rtl;width:100%;padding-bottom:12px;border-bottom:2px solid #333;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.phdr-r{display:flex;align-items:center;gap:10px}
.phdr-r img{max-height:65px;max-width:120px;object-fit:contain;border:none;box-shadow:none;outline:none;background:none}
.phdr-name{font-size:15px;font-weight:700;color:var(--navy)}
.phdr-title{font-size:16px;font-weight:700;color:var(--navy);text-align:center;flex:1}
.phdr-l{width:75px;height:75px;flex-shrink:0}
.phdr-l img{width:75px;height:75px;object-fit:contain}
.pmeta{font-size:10.5px;color:var(--steel);text-align:center;margin:-8px 0 14px}
.pmeta b{color:var(--navy)}
.psec{background:var(--navy);color:#fff;font-weight:700;font-size:12px;padding:5px 10px;margin-top:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));border:1px solid var(--light)}
.pgrid .pi{display:flex;border:1px solid var(--light)}
.pgrid .pi .k{background:var(--light);color:var(--steel);font-weight:700;font-size:10.5px;padding:6px 8px;min-width:135px;line-height:1.4}
.pgrid .pi .v{padding:6px 8px;font-weight:700;color:var(--navy);font-size:12px;flex:1}
#printdoc table,.pdblock table{margin-top:0}
#printdoc th,.pdblock th{background:var(--steel)}
.sigs{display:flex;gap:0;margin-top:18px}
.sig{flex:1;border:1px solid var(--silver)}
.sig .h{background:var(--navy);color:#fff;text-align:center;font-size:11.5px;font-weight:700;padding:5px}
.sig .b{padding:10px;font-size:11.5px;color:var(--steel);line-height:2.1}
.pfoot{text-align:center;color:var(--steel);font-size:10.5px;margin-top:14px;border-top:1px solid var(--silver);padding-top:8px}
@page{size:A4;margin:12mm}
@media print{
  #side,.no-print,.pagehead,.pagesub,.redline{display:none!important}
  body,#printdoc,#shareView,.pdblock{background:#fff!important;font-family:'Tajawal','Cairo',sans-serif!important;
    print-color-adjust:exact;-webkit-print-color-adjust:exact}
  #main{padding:0;max-width:none}
  #shareView{padding:0}
  #printdoc,.pdblock{border:none;padding:0;max-width:none;box-shadow:none}
  th,.psec,.phdr-name,.pline,.sig .h,.tag,.kpi,.totrow,.pgrid .pi .k,tfoot td{
    print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}
  #printdoc img,.pdblock img{display:block!important;visibility:visible!important;max-width:100%}
  /* تنبيهات/تحذيرات داخلية للموظفين (اعتماد، سقف مبلغ...) لا تظهر أبداً على نسخة الطباعة/PDF التي يستلمها العميل أو المورد */
  [class*="alert"],[class*="warn"],[class*="warning"],[class*="notice"],[data-no-print="true"]{display:none!important}
}
/* لوحة كانبان للصفقات */
.kb{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:8px}
.kbcol{background:var(--light);border-radius:10px;min-width:200px;flex:1;padding:8px}
.kbcol h4{font-size:12.5px;color:var(--navy);margin-bottom:8px;display:flex;justify-content:space-between}
.kbcard{background:#fff;border:1px solid var(--silver);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:grab;font-size:12px}
.kbcard b{color:var(--navy);display:block;font-size:12.5px}
.kbcol.dragover{outline:2px dashed var(--red)}
/* شارة الإشعارات */
.bellbtn{position:relative;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:inherit;margin-top:8px}
.bellbtn .cnt{position:absolute;top:-7px;left:-7px;background:var(--red);color:#fff;border-radius:50%;min-width:17px;height:17px;font-size:10.5px;display:flex;align-items:center;justify-content:center;padding:0 3px}
/* جرس تنبيه العناصر المُعيَّنة — بجانب اسم المستخدم في الشريط الجانبي */
.navgrp .bellbtn{margin-top:0;font-size:14px;padding:3px 8px}
.asgpanel{position:absolute;top:100%;left:0;margin-top:6px;width:260px;max-height:320px;overflow-y:auto;background:#fff;border:1px solid var(--silver);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:2000}
.asgitem{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--light)}
.asgitem:last-child{border-bottom:none}
.asgicon{font-size:18px;flex-shrink:0}
.asgtxt{flex:1;font-size:12px;color:var(--ink);line-height:1.5}
/* خطأ الحقول */
.fld input.err,.fld select.err{border-color:var(--red);outline:1px solid var(--red)}
.flderr{color:var(--red);font-size:11px;margin-top:2px}
/* حاوية صورة موحّدة بخلفية بيضاء */
.imgbox{background:#fff;display:flex;align-items:center;justify-content:center;border:1px solid var(--silver);border-radius:8px;overflow:hidden}
.imgbox img{object-fit:contain;width:100%;height:100%}
.imgbox .noimg{color:var(--steel);font-size:11px;text-align:center}
.savestate{font-size:11px;color:var(--steel)}
.savestate.err{color:var(--red);font-weight:700}
/* ═══ روابط موافقة العميل ═══ */
.fld textarea{min-height:84px;resize:vertical;line-height:1.8}
.sharebox{border:1.5px dashed var(--steel);border-radius:10px;padding:12px;margin:10px 0;background:var(--pale)}
.sharebox h4{color:var(--navy);font-size:13px;margin-bottom:8px}
.sharebox .lnk{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sharebox .lnk input{flex:1;min-width:200px;padding:7px 9px;border:1px solid var(--silver);border-radius:6px;font-size:12px;direction:ltr;background:#fff}
.sharebox.ok{border-color:var(--green);background:#e6f4ea}
/* صفحة العميل العامة — تعرض نفس مستند الطباعة/PDF (.pdblock) حرفياً + بطاقة إقرار الموافقة */
#shareView{min-height:100vh;background:var(--pale);padding:18px 12px}
.shcard{background:#fff;border:1px solid var(--silver);border-radius:12px;max-width:820px;margin:0 auto 14px;padding:20px;box-shadow:0 4px 18px rgba(14,35,66,.08)}
.shok{text-align:center;padding:26px 12px}
.shok .big{font-size:44px;margin-bottom:8px}
.shok h3{color:var(--green);font-family:'Cairo';font-size:18px;margin-bottom:6px}
.pdblock{margin:0 auto 14px;box-shadow:0 4px 18px rgba(14,35,66,.08)}
/* ═══ النموذج العام: تقديم شكوى / طلب صيانة وضمان بلا حساب ═══ */
#pubReqView{min-height:100vh;background:var(--pale);padding:18px 12px}
.pubhead{max-width:640px;margin:0 auto 14px;text-align:center}
.pubhead .logo{width:64px;height:64px;margin:0 auto 8px;border-radius:10px}
.pubhead h1{color:var(--navy);font-family:'Cairo';font-size:18px}
.pubhead p{color:var(--steel);font-size:12.5px;margin-top:2px}
.pubtabs{display:flex;gap:10px;max-width:640px;margin:0 auto 14px}
.pubtab{flex:1;background:#fff;border:2px solid var(--silver);border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;font-family:inherit;font-weight:700;color:var(--navy);font-size:13.5px;line-height:1.6}
.pubtab .ic{font-size:26px;display:block;margin-bottom:4px}
.pubtab.active{border-color:var(--red);background:#fdecea}
.pubcard{background:#fff;border:1px solid var(--silver);border-radius:12px;max-width:640px;margin:0 auto 14px;padding:20px;box-shadow:0 4px 18px rgba(14,35,66,.08)}
.filelist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.filechip{display:flex;align-items:center;gap:6px;background:var(--light);border-radius:20px;padding:5px 10px;font-size:11.5px;color:var(--navy)}
.filechip button{background:none;border:none;color:var(--red);font-weight:800;cursor:pointer;font-size:13px;padding:0 2px}
.pubreqno{background:var(--light);border-radius:8px;padding:10px 14px;font-family:'Cairo';font-weight:800;color:var(--navy);font-size:17px;letter-spacing:.5px;direction:ltr;text-align:center;margin:10px 0}
/* تنبيه حيّ لوصول طلب عميل جديد عبر الرابط العام */
.toastMsg{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:opacity .4s;animation:toastIn .25s ease}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
/* ═══ الجوال: شريط علوي + قائمة جانبية منزلقة ═══ */
#topbar{display:none}
#backdrop{display:none}
@media(max-width:820px){
  #topbar{display:flex;align-items:center;gap:8px;position:fixed;top:0;right:0;left:0;height:54px;
    background:var(--navy);color:#fff;z-index:1000;padding:0 12px;box-shadow:0 2px 10px rgba(0,0,0,.28)}
  #topbar .mtitle{font-family:'Cairo';font-weight:800;font-size:15px;flex:1;overflow:hidden;
    white-space:nowrap;text-overflow:ellipsis}
  #hamb{background:none;border:none;color:#fff;font-size:26px;cursor:pointer;padding:2px 8px;line-height:1}
  #topbar .tbell{position:relative;background:none;border:none;color:#fff;font-size:21px;cursor:pointer;padding:4px 6px}
  #topbar .tbell .cnt{position:absolute;top:-1px;left:-3px;background:var(--red);color:#fff;border-radius:50%;
    min-width:16px;height:16px;font-size:10px;font-family:'Tajawal';display:flex;align-items:center;justify-content:center;padding:0 3px}
  #side{position:fixed;top:0;right:0;height:100vh;width:min(86vw,290px);z-index:1002;overflow-y:auto;
    padding-top:14px;transform:translateX(105%);transition:transform .25s ease;box-shadow:-6px 0 20px rgba(0,0,0,.3)}
  body.nav-open #side{transform:translateX(0)}
  body.nav-open #backdrop{display:block}
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1001}
  #main{padding:66px 12px 26px;max-width:none}
  /* منع تكبير iOS التلقائي عند التركيز على الحقول (حجم ≥16px) */
  .fld input,.fld select,.fld textarea,.linestable input,.linestable select,.searchbar{font-size:16px}
  /* أهداف لمس أكبر */
  .navbtn{padding:12px 16px;font-size:14px}
  .btn{padding:11px 18px}
  .btn.sm{padding:7px 12px;font-size:12.5px}
  .btnrow{gap:10px}
  .searchbar{width:100%}
  .pagehead h2{font-size:17px}
  .kpis{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .kpi .val{font-size:19px}
  th,td{padding:9px 8px}
  .kbcol{min-width:78vw}
  #printdoc{padding:16px}
  .phdr{flex-wrap:wrap;justify-content:center;text-align:center}
  .phdr-title{order:3;flex-basis:100%}
}
@media(max-width:420px){
  .formgrid{grid-template-columns:1fr}
  #topbar .mtitle{font-size:14px}
}
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, serverTimestamp,
           collection, query, orderBy, limit, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
           createUserWithEmailAndPassword, sendPasswordResetEmail, updatePassword,
           EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app-check.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCH9ZC6knpkdZ9SGiWq5lN1EDgqmrHOKUU",
    authDomain: "erp-workshop-equip.firebaseapp.com",
    projectId: "erp-workshop-equip",
    storageBucket: "erp-workshop-equip.firebasestorage.app",
    messagingSenderId: "827086737774",
    appId: "1:827086737774:web:bcf2da1ea2299e473df17f",
    measurementId: "G-X3PQTJY06X"
  };

  const ERP_DOC_PATH = { collection: 'erp', id: 'main' };
  const hasValidFirebaseConfig = () => !!(
    FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId && FIREBASE_CONFIG.appId &&
    !String(FIREBASE_CONFIG.apiKey).includes('PASTE_') &&
    !String(FIREBASE_CONFIG.projectId).includes('PASTE_') &&
    !String(FIREBASE_CONFIG.appId).includes('PASTE_')
  );

  let firestoreReady = false;
  let db = null;

  const firebaseApp = initializeApp(FIREBASE_CONFIG);
  // App Check (reCAPTCHA v3) — يُفعَّل فوراً بعد تهيئة التطبيق وقبل أي اتصال بـ Firestore/Auth، بلا حجب لتحميل الصفحة
  initializeAppCheck(firebaseApp, {
    provider: new ReCaptchaV3Provider('6LcHHE0tAAAAA9Hqqiy6D6a7NDDnYRhhhmrmDDl'),
    isTokenAutoRefreshEnabled: true
  });
  const auth = getAuth(firebaseApp);

  async function getDb(){
    if(!hasValidFirebaseConfig()) throw new Error('Firebase config missing');
    if(!db){
      db = getFirestore(firebaseApp);
      firestoreReady = true;
    }
    return db;
  }

  async function getCloudState(){
    const _db = await getDb();
    const ref = doc(_db, ERP_DOC_PATH.collection, ERP_DOC_PATH.id);
    const snap = await getDoc(ref);
    return snap.exists() ? snap.data() : null;
  }

  async function saveCloudState(value){
    const _db = await getDb();
    const ref = doc(_db, ERP_DOC_PATH.collection, ERP_DOC_PATH.id);
    await setDoc(ref, { value, updatedAt: serverTimestamp() });
    return true;
  }

  window.storage = {
    async get(key){
      if(key !== 'erp:state') return { value: null };
      const cloud = await getCloudState();
      if(cloud && typeof cloud.value === 'string') return { value: cloud.value };
      return { value: null };
    },
    async set(key, value){
      if(key !== 'erp:state') return false;
      await saveCloudState(value);
      return true;
    },
    isConfigured(){
      return hasValidFirebaseConfig();
    },
    isReady(){
      return firestoreReady;
    }
  };

  /* ═══ تخزين الصور: كل صورة في مستند منفصل ضمن مجموعة media (حفاظاً على حد مستند الحالة) ═══ */
  const mediaCache = {};
  window.media = {
    cache: mediaCache,
    src(id){ return (id && mediaCache[id]) || ''; },
    async save(dataUrl){
      const _db = await getDb();
      const id = 'img_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
      await setDoc(doc(_db, 'media', id), { d: dataUrl, at: serverTimestamp() });
      mediaCache[id] = dataUrl;
      return id;
    },
    async load(id){
      if(!id) return '';
      if(mediaCache[id]) return mediaCache[id];
      try{
        const _db = await getDb();

  function resizeImageDataUrl(file, maxDim=900, quality=0.8){
    return new Promise((resolve,reject)=>{
      const fr = new FileReader();
      fr.onerror = () => reject(new Error('فشل قراءة الملف'));
      fr.onload = () => {
        const im = new Image();
        im.onerror = () => reject(new Error('صورة غير صالحة'));
        im.onload = () => {
          let {width:w, height:h} = im;
          if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
          else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
          const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(im,0,0,w,h);
          resolve(cv.toDataURL('image/jpeg', quality));
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  async function fileToAttachment(file){
    if(file.type.startsWith('image/')) return { name:file.name, kind:'img', d: await resizeImageDataUrl(file) };
    if(file.type === 'application/pdf'){
      if(file.size > 500*1024) throw new Error('حجم ملف PDF يتجاوز 500KB — رجاءً صغّر الملف — PDF file exceeds 500KB, please compress it');
      return new Promise((resolve,reject)=>{
        const fr = new FileReader();
        fr.onerror = () => reject(new Error('فشل قراءة الملف'));
        fr.onload = () => resolve({ name:file.name, kind:'pdf', d: fr.result });
        fr.readAsDataURL(file);
      });
    }
    throw new Error('الأنواع المدعومة: صور JPG/PNG و PDF فقط — Supported types: JPG/PNG images and PDF only');
  }

    function doLogin(){
      errEl.textContent = '';
      loginBtn.disabled = true; loginBtn.textContent = 'جارِ الدخول...';
      signInWithEmailAndPassword(auth, emailEl.value.trim(), passEl.value)
        .catch(() => { errEl.textContent = 'البريد الإلكتروني أو كلمة المرور غير صحيحة'; })
        .finally(() => { loginBtn.disabled = false; loginBtn.textContent = 'دخول'; });
    }
    loginBtn.addEventListener('click', doLogin);
    passEl.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
    signOutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if(user){
        window.authUser = { uid: user.uid, email: user.email };
        loginOverlay.style.display = 'none';
        appEl.style.display = 'flex';
        window.dispatchEvent(new Event('erp-auth-ready'));
        if(!window._intakeWatching){
          window._intakeWatching = true;
          window.pendingIntake = [];
          window.intake.watch(list => {
            window.pendingIntake = list;
            try{
              const v = (typeof window.getView==='function') ? window.getView() : null;
              if(['complaints','srv','dash','notifs'].includes(v) && typeof render==='function') render();
              else if(typeof renderNav==='function') renderNav();
            }catch(e){}
          });
        }
      } else {
        window.authUser = null;
        loginOverlay.style.display = 'flex';
        appEl.style.display = 'none';
        passEl.value = '';
      }
    });
  }
</script>

const quotePaid = no => S.payments.filter(p=>p.quoteRef===no).reduce((a,p)=>a+(+p.amount||0),0);
const quoteRemaining = q => (+q.total||0) - quotePaid(q.no);
const custQuotes = name => S.quotes.filter(q=>q.customer===name && q.status!=='ملغي' && q.status!=='مرفوض');
// الذمم: العروض المقبولة أو المرتبط بها أمر بيع
const receivableQuotes = () => S.quotes.filter(q=> q.status==='مقبول' || S.sos.some(o=>o.quoteRef===q.no && o.status!=='ملغي'));

/* ═══════════════ الأسماء الثنائية للمنتجات ═══════════════ */
function prodLangPref(){ const u=currentUser(); return (u && u.prodLang) || 'both'; }
function prodLabel(p){
  if(!p) return '';
  const pref = prodLangPref();
  if(pref==='ar' || !p.nameEn) return p.nameAr||'';
  if(pref==='en') return p.nameEn||p.nameAr||'';
  return (p.nameAr||'') + (p.nameEn?` — ${p.nameEn}`:'');
}
const prodLabelByName = name => { const p=S.products.find(x=>x.nameAr===name); return p?prodLabel(p):(name||''); };

/* ═══════════════ الإشعارات (محسوبة من البيانات) ═══════════════ */
function daysSince(d){ return d ? Math.floor((Date.now()-new Date(d).getTime())/86400000) : 0; }
function computeNotifs(){
  const N = [];
  S.quotes.filter(q=>['مفتوح','مرسل'].includes(q.status) && daysSince(q.date)>14)
    .forEach(q=>N.push({id:'q_'+q.no, pr:'mid', type:'متابعة', msg:`عرض السعر ${q.no} (${q.customer}) بلا متابعة منذ ${daysSince(q.date)} يوماً`, view:'quotes'}));
  S.opps.filter(o=>!['رابحة','خاسرة'].includes(o.stage) && daysSince(o._u||o.date)>14)
    .forEach(o=>N.push({id:'o_'+o.no, pr:'mid', type:'صفقة راكدة', msg:`الصفقة ${o.no} (${o.name||o.customer}) راكدة منذ ${daysSince(o._u||o.date)} يوماً`, view:'opps'}));
  receivableQuotes().filter(q=>quoteRemaining(q)>0 && daysSince(q.date)>30)
    .forEach(q=>N.push({id:'ar_'+q.no, pr:'high', type:'تأخر سداد', msg:`${q.customer}: متبقٍ ${fmt(quoteRemaining(q))} على ${q.no} منذ ${daysSince(q.date)} يوماً`, view:'ar'}));
  S.products.filter(p=>p.min!==''&&p.min!=null&&stockQty(p.nameAr)<=+p.min)
    .forEach(p=>N.push({id:'st_'+p.code, pr:'high', type:'مخزون', msg:`المنتج ${p.nameAr} عند/تحت الحد الأدنى (الرصيد ${stockQty(p.nameAr)})`, view:'products'}));
  S.lines.filter(l=>l.supplyType==='طلب خارجي' && l.extStatus!=='تم التوريد')

  S.activities.filter(a=>a.due && a.due<today() && a.status!=='منجز')

}

/* ═══════════════ استيعاب طلبات النموذج العام في complaints/srv (نفس بنية الحقول الحالية تماماً) ═══════════════ */
async function absorbIntake(type){
  if(!window.intake) return;
  const pend = (window.pendingIntake||[]).filter(x=>x.type===type);
  if(!pend.length) return;
  const ent = type==='srv' ? 'srv' : 'complaints';
  const docCode = type==='srv' ? 'SRV1' : 'QLT2';
  const title = VIEWS[ent].title;
  let changed = false;
  for(const it of pend){
    try{
      const mobNorm = String(it.mobile||'').replace(/[^0-9]/g,'');
      const match = S.customers.find(c =>
        (mobNorm && c.mobile && String(c.mobile).replace(/[^0-9]/g,'')===mobNorm) ||
        (c.name && it.customerName && c.name.trim()===it.customerName.trim()));
      const customerName = match ? match.name : (it.customerName||'');
      const atts = [];
      for(const f of (it.files||[])){
        try{ const id = await window.media.save(f.d); atts.push({id, kind:f.kind, name:f.name, by:'العميل (رابط عام) — Customer (Public Link)', at: today()}); }
        catch(e){ /* نتجاهل ملفاً فشل ترحيله ونكمل بقية الطلب */ }
      }
      const base = { id: uid(), no: nextNo(docCode), date: today(), customer: customerName,
        source: 'رابط عام', pubRef: it.pubRef||'', atts,
        _pub: { mobile: it.mobile||'', crOrAccount: it.crOrAccount||'', invoiceRef: it.invoiceRef||'' } };
      const rec = type==='srv'
        ? Object.assign(base, { serial: it.serial||'', priority: it.requestType==='ضمان'?'عاجل (48 ساعة)':'عادي (5 أيام)',
            fault: it.description||'', tech:'', fin: it.requestType==='ضمان'?'ضمان':'خارج الضمان',
            status:'مفتوح', rating:'', notes: it.productModel?('الموديل — Model: '+it.productModel):'', terms:'' })
        : Object.assign(base, { cat: it.category||'أخرى', sev:'متوسط', summary: it.description||'',
            root:'', action:'', owner:'', sat:'لم يُتواصل', status:'مفتوحة' });
      S[ent].push(rec);
      logAudit('استلام طلب عام', title, rec.no, customerName + ' — ' + (it.mobile||''));
      await window.intake.remove(it.id);
      changed = true;
    }catch(e){ /* نتجاهل عنصراً فشل استيعابه ونكمل الباقي */ }
  }
  if(changed){ persist(); render(); }
}
window.absorbIntake = absorbIntake;

/* ═══════════════ تصدير CSV (يفتح في Excel) ═══════════════ */
function dlCSV(name, header, rows){
  const csv = '\ufeff' + [header].concat(rows).map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = name + '_' + today() + '.csv'; a.click();
}

/* ═══════════════ الصور المصغّرة ═══════════════ */
function readImageAsThumb(file, maxDim=520, quality=0.78, fmt='image/jpeg'){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('فشل قراءة الملف'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => reject(new Error('صورة غير صالحة'));
      im.onload = () => {
        let {width:w, height:h} = im;
        if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); // خلفية بيضاء ثابتة
        ctx.drawImage(im,0,0,w,h);
        resolve(cv.toDataURL(fmt, quality));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
// حاوية موحّدة: خلفية بيضاء + contain + بديل عند غياب الصورة
const imgTag = (id, size=34) => {

// رفع صورة من عنصر إدخال ملف وتخزين المُعرّف في حقل مخفي
window.onImgPick = async (inputEl, holderId, previewId, opts) => {
  const f = inputEl.files && inputEl.files[0]; if(!f) return;
  const o = opts || {};
  try{
    // PNG بلا فقدان لصور QR (JPEG يُتلف حواف الرموز الدقيقة ويُفقدها القابلية للمسح)
    const durl = await readImageAsThumb(f, o.maxDim||520, o.quality||0.78, o.fmt||'image/jpeg');
    const id = await window.media.save(durl);

/* ═══════════════ المرفقات العامة على السجلات ═══════════════ */
function readAttachFile(file){
  return new Promise((resolve,reject)=>{
    if(file.type.startsWith('image/')) return readImageAsThumb(file, 900, 0.8).then(d=>resolve({d, kind:'img'})).catch(reject);
    if(file.type==='application/pdf'){
      if(file.size > 600*1024) return reject(new Error('حجم PDF يتجاوز 600KB — صغّر الملف'));
      const fr = new FileReader();
      fr.onerror = ()=>reject(new Error('فشل قراءة الملف'));
      fr.onload = ()=>resolve({d:fr.result, kind:'pdf'});
      fr.readAsDataURL(file);
      return;
    }
    reject(new Error('الأنواع المدعومة: صور و PDF فقط'));
  });
}
function attBox(entKey, rec){
  const atts = rec.atts || [];
  const items = atts.map((a,i)=>`<div style="display:inline-flex;flex-direction:column;align-items:center;gap:3px;margin:4px">
    ${a.kind==='img' ? `<span class="imgbox" style="width:74px;height:74px"><img src="${window.media.src(a.id)||''}"></span>`
                     : `<a href="${window.media.src(a.id)||'#'}" download="${esc(a.name||'file.pdf')}" style="display:flex;align-items:center;justify-content:center;width:74px;height:74px;border:1px solid var(--silver);border-radius:8px;background:#fff;font-size:24px;text-decoration:none">📄</a>`}
    <span style="font-size:10px;color:var(--steel);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.name||'')}</span>
    ${isAdmin()?`<button class="btn sm red" style="padding:1px 7px;font-size:10px" onclick="attDel('${entKey}','${rec.id}',${i})">حذف</button>`:''}
  </div>`).join('');
  return `<div class="card" style="margin-top:10px;background:var(--pale)"><h3>📎 المرفقات (${atts.length})</h3>
    <div style="display:flex;flex-wrap:wrap">${items||'<span style="color:var(--steel);font-size:12px">لا مرفقات</span>'}</div>
    ${canEdit()?`<input type="file" accept="image/*,application/pdf" style="margin-top:8px" onchange="attAdd('${entKey}','${rec.id}',this)">`:''}
  </div>`;
}
window.attAdd = async (entKey, recId, input) => {
  const f = input.files && input.files[0]; if(!f) return;
  const rec = S[entKey].find(r=>r.id===recId); if(!rec) return;
  try{
    const {d, kind} = await readAttachFile(f);
    const id = await window.media.save(d);
    if(!rec.atts) rec.atts = [];
    rec.atts.push({id, kind, name: f.name, by: curName(), at: today()});
    persist(); logAudit('إرفاق ملف', entKey, rec.no||rec.code||rec.name, f.name); render();
  }catch(e){ alert('تعذّر الإرفاق: '+e.message); }
};
window.attDel = (entKey, recId, i) => {
  if(!isAdmin()) return alert('حذف المرفقات للمدير فقط');
  const rec = S[entKey].find(r=>r.id===recId); if(!rec||!rec.atts) return;
  if(!confirm('حذف المرفق «'+(rec.atts[i].name||'')+'»؟')) return;
  const nm = rec.atts[i].name;
  rec.atts.splice(i,1); persist(); logAudit('حذف مرفق', entKey, rec.no||rec.code||rec.name, nm); render();
};

/* الترقيم الصارم — العداد لا يرجع للخلف أبداً ويُعاد سنوياً */
function nextNo(code){
  const y = new Date().getFullYear();
  const k = code + '-' + y;
  S.counters[k] = (S.counters[k] || 0) + 1;
  persist();
  return `${code}-${y}-${String(S.counters[k]).padStart(4,'0')}`;
}

/* ═══════════════ منطق الأعمال المشتق ═══════════════ */
const stockQty = name => S.stock.reduce((a,m)=> a + (m.product===name ? (m.type==='وارد'? +m.qty : -m.qty) : 0), 0);
const quoteLines = no => S.lines.filter(l=>l.docNo===no);
const lineTotal = l => (+l.qty||0) * (l.override!==''&&l.override!=null ? +l.override : +l.defPrice||0);
function quoteTotals(no, disc){
  const g = quoteLines(no).reduce((a,l)=>a+lineTotal(l),0);
  const d = g * (+disc||0)/100, net = g-d, vat = net*0.15;
  return {gross:g, disc:d, net, vat, total:net+vat};
}
const supLastEval = name => { const evs = S.evals.filter(e=>e.supplier===name); return evs.length ? evs[evs.length-1] : null; };
function supClass(name){
  const e = supLastEval(name);
  if(!e) return {t:'غير مقيَّم', cls:'info'};
  const s = +e.total;
  return s>=24 ? {t:'معتمد', cls:'ok'} : s>=18 ? {t:'معتمد بشروط', cls:'mid'} : {t:'موقوف', cls:'warn'};
}
const supOK = () => S.suppliers.filter(s=>supClass(s.name).t!=='موقوف');
function warrantyEnd(qcRow){
  if(!qcRow?.wstart) return '';
  const p = S.products.find(p=>p.nameAr===qcRow.product);
  if(!p) return '';
  const d = new Date(qcRow.wstart); d.setMonth(d.getMonth() + (+p.warranty||0));
  return d.toISOString().slice(0,10);
}
function warrantyStatus(serial, atDate){
  const rows = S.qc.filter(q=>q.serial===serial && q.wstart);
  if(!rows.length) return {t:'غير مسجل', cls:'info'};
  const end = warrantyEnd(rows[rows.length-1]);
  return (atDate||today()) <= end ? {t:'ساري حتى '+end, cls:'ok'} : {t:'منتهٍ ('+end+')', cls:'warn'};
}

const buildAddr = c => c ? [c.bldg&&('مبنى '+c.bldg), c.street, c.district&&('حي '+c.district), c.city,
  c.postal, c.addl&&('إضافي '+c.addl), c.unit&&('وحدة '+c.unit)].filter(Boolean).join('، ') || (c.city||'') : '';
const expVat = e => e.hasVat==='نعم' ? (+e.amount||0) - (+e.amount||0)/1.15 : 0;
const expNet = e => (+e.amount||0) - expVat(e);
const pettySpent = no => S.expenses.filter(e=>e.pettyRef===no).reduce((a,e)=>a+(+e.amount||0),0);
const pettyVatPaid = no => S.expenses.filter(e=>e.pettyRef===no).reduce((a,e)=>a+expVat(e),0);
const qOf = d => d ? Math.floor((+d.slice(5,7)-1)/3)+1 : 0;
const inQ = (d,y,q) => d && d.slice(0,4)==String(y) && qOf(d)===q;

/* ═══ تنبيه حيّ (toast + صوت) عند وصول طلب عام جديد — يستدعيها module script عبر onSnapshot ═══ */
function showToast(msg){
  if(!document.body) return;
  let host = document.getElementById('toastHost');
  if(!host){ host = document.createElement('div'); host.id='toastHost';
    host.style.cssText = 'position:fixed;bottom:16px;left:16px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:90vw';
    document.body.appendChild(host); }
  const el = document.createElement('div');
  el.className = 'toastMsg'; el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(), 400); }, 6000);
}
function playNotifySound(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.35);
  }catch(e){ /* الصوت اختياري — لا نكسر شيئاً إن تعذّر تشغيله */ }
}

function fieldInput(f, val){
  const v = val==null?'':val;
  if(f.t==='ro') return `<input readonly value="${esc(v||'— يتولد تلقائياً عند الحفظ —')}">`;
  if(f.t==='sel'){
    const opts = (typeof f.o==='function'?f.o():f.o).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('');
    const plusBtn = f.plus ? `<button type="button" class="btn sm ghost" style="margin-top:4px" onclick="addCategory('f_${f.k}')">+ إضافة فئة جديدة</button>` : '';
    return `<select id="f_${f.k}" ${f.onchange?`onchange="${f.onchange}"`:''}><option value=""></option>${opts}</select>${plusBtn}`;
  }
  if(f.t==='ta') return `<textarea id="f_${f.k}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  if(f.t==='date') return `<input type="date" id="f_${f.k}" value="${esc(v)}">`;
  if(f.t==='num') return `<input type="number" step="any" id="f_${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
  if(f.t==='img'){
    const src = v && window.media ? window.media.src(v) : '';
    const pv = src ? `<span class="imgbox" style="display:inline-flex;width:260px;height:260px;max-width:100%"><img src="${src}"></span>`
                   : `<span class="imgbox" style="display:inline-flex;width:140px;height:140px"><span class="noimg">لا توجد صورة</span></span>`;
    return `<input type="hidden" id="f_${f.k}" value="${esc(v)}">
      <div id="pv_${f.k}" style="margin-bottom:6px">${pv}</div>
      <input type="file" accept="image/*" onchange="onImgPick(this,'f_${f.k}','pv_${f.k}')">`;
  }
  if(f.t==='multi'){
    const cur = String(v||'').split('|').filter(Boolean);
    const opts = (typeof f.o==='function'?f.o():f.o);
    return `<input type="hidden" id="f_${f.k}" value="${esc(cur.join('|'))}">
      <div style="display:flex;flex-wrap:wrap;gap:8px;border:1px solid var(--silver);border-radius:6px;padding:7px">${
        opts.map(o=>`<label style="font-size:12.5px;display:flex;align-items:center;gap:3px;font-weight:400"><input type="checkbox" value="${esc(o)}" ${cur.includes(o)?'checked':''} onchange="multiSet('f_${f.k}')">${esc(o)}</label>`).join('') || '<span style="color:var(--steel);font-size:12px">لا خيارات</span>'
      }</div>`;
  }
  return `<input id="f_${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
}

const SHARE_CONF = {
  quotes: { label:'عرض سعر', printType:'quote', snap(r){ return { kind:'quote', label:'عرض سعر', no:r.no, date:r.date, customer:r.customer, company:(S.company||{}).name||'' }; } },
  dos:    { label:'إذن تسليم', printType:'do', snap(r){ return { kind:'do', label:'إذن تسليم', no:r.no, date:r.date, customer:r.customer, company:(S.company||{}).name||'' }; } },
  srv:    { label:'طلب صيانة (ضمان)', printType:'srv', snap(r){ return { kind:'srv', label:'طلب صيانة', no:r.no, date:r.date, customer:r.customer||'', company:(S.company||{}).name||'' }; } }
};
function makeToken(){
  if(typeof crypto!=='undefined' && crypto.getRandomValues){
    const a = new Uint8Array(24); crypto.getRandomValues(a);
    return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  return 'tk' + Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
}
function shareUrl(token){
  const base = (typeof location!=='undefined') ? location.origin + location.pathname : '';
  return base + '?share=' + token;
}
// حد مستند Firestore 1MiB — إن تجاوزته النسخة (بسبب صور مضمَّنة) نستبدل الصور بعنصر نائب مطابق للشكل دون كسر التخطيط
function stripHeavyImages(html){
  return html
    .replace(/<span class="imgbox"[^>]*>\s*<img[^>]*>\s*<\/span>/gi, '<span class="imgbox" style="display:inline-flex;width:30px;height:30px;vertical-align:middle"><span class="noimg">🖼</span></span>')
    .replace(/<div class="logo" style="padding:0;overflow:hidden">\s*<img[^>]*>\s*<\/div>/gi, '<div class="logo">الشعار<br>LOGO</div>');
}
async function shareDoc(ent, id){
  const conf = SHARE_CONF[ent]; if(!conf) return;
  const r = S[ent].find(x=>x.id===id); if(!r) return;
  if(!String(r.terms||'').trim()){ alert('⚠ يجب تعبئة خانة «الشروط والأحكام» وحفظ المستند قبل إنشاء رابط الموافقة'); return; }
  if(r.shareToken){ render(); return; }
  try{
    let docHtml = buildDoc(conf.printType, r.no);
    if(!docHtml){ alert('تعذّر إنشاء نسخة المستند — تأكد من حفظ السجل أولاً'); return; }
    const payload = { ...conf.snap(r), docHtml };
    if(JSON.stringify(payload).length > 900000) payload.docHtml = stripHeavyImages(docHtml);
    const token = makeToken();
    await window.shares.create(token, payload);
    r.shareToken = token; r._u = today();
    logAudit('إنشاء رابط موافقة', conf.label, r.no, '');
    persist(); render();
  }catch(e){ alert('تعذّر إنشاء الرابط: ' + ((e&&e.message)||e)); }
}
window.shareDoc = shareDoc;
function copyShare(token){
  const url = shareUrl(token);
  if(typeof navigator!=='undefined' && navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(url).then(()=>alert('تم نسخ الرابط ✓'), ()=>prompt('انسخ الرابط:', url));
  else prompt('انسخ الرابط:', url);
}
window.copyShare = copyShare;

window.assignRecord = (entKey, recId) => {
  const rec = S[entKey].find(x=>x.id===recId); if(!rec) return;
  const sel = document.getElementById('asg_'+entKey+'_'+recId);

    <button type="button" class="btn sm" onclick="shareDoc('${ent}','${r.id}')">إنشاء الرابط</button></div>`;
}
async function checkShares(ent, manual){
  if(!window.shares || !window.shares.get) return;
  const conf = SHARE_CONF[ent]; if(!conf) return;
  const pend = (S[ent]||[]).filter(r=>r.shareToken && !r.clientAccept);
  if(!pend.length) return;
  let changed = false;
  for(const r of pend.slice(0,25)){
    try{
      const d = await window.shares.get(r.shareToken);
      if(d && d.status==='accepted'){
        r.clientAccept = { name:d.acceptName||'', mobile:d.acceptMobile||'', at:d.acceptedOn||'' };
        if(ent==='quotes' && r.status!=='مقبول') r.status = 'مقبول';
        logAudit('موافقة عميل إلكترونية', conf.label, r.no, r.clientAccept.name + ' — ' + r.clientAccept.mobile);
        changed = true;
      }
    }catch(e){}
  }
  if(changed){ persist(); render(); }
  else if(manual) alert('لم يوافق العميل بعد');
}
window.checkShares = checkShares;

window.delRow = (key,id) => {
  if(!confirm('حذف السجل نهائياً؟ (الرقم لن يُعاد استخدامه — العداد صارم)')) return;
  const rec = S[VIEWS[key].ent].find(r=>r.id===id);
  S[VIEWS[key].ent] = S[VIEWS[key].ent].filter(r=>r.id!==id);
  logAudit('حذف', VIEWS[key].title, rec&&(rec.no||rec.code||rec.name)||id, '');
  persist(); render();
};
window.saveRegister = key => {
  const V = VIEWS[key];
  const r = editId ? {...S[V.ent].find(x=>x.id===editId)} : {id:uid()};
  clearFldErrs();
  for(const f of V.fields){
    if(f.t==='ro') continue;
    const el = document.getElementById('f_'+f.k);
    r[f.k] = el ? el.value : r[f.k];
    if(f.req && !r[f.k]) return fldErr(f.k, 'هذا الحقل مطلوب');
    if(f.t==='num' && r[f.k]!=='' && r[f.k]!=null && +r[f.k]<0 && !f.allowNeg)
      return fldErr(f.k, 'لا يُقبل قيمة سالبة');
    if(f.t==='date' && r[f.k] && isNaN(new Date(r[f.k]).getTime()))
      return fldErr(f.k, 'تاريخ غير صالح');
  }
  if(V.validate){ const err = V.validate(r); if(err) return fldErr(err[0], err[1]); }
  if(!editId){
    if(V.autoCode){
      const mk = 'M'+V.autoCode;
      const maxEx = S[V.ent].reduce((a,x)=>Math.max(a, +(String(x.code||'').split('-').pop())||0), 0);
      S.counters[mk] = Math.max(S.counters[mk]||0, maxEx) + 1;
      r.code = V.autoCode+'-'+String(S.counters[mk]).padStart(V.autoCode==='EMP'?3:4,'0');
    }
    if(V.docCode || V.numFn) r.no = V.numFn ? V.numFn(r) : nextNo(V.docCode);
  }
  r._u = today(); // آخر تحديث — يُستخدم لاكتشاف الركود
  if(V.beforeSave) V.beforeSave(r);
  if(editId){ const i=S[V.ent].findIndex(x=>x.id===editId); S[V.ent][i]=r; }
  else S[V.ent].push(r);
  logAudit(editId?'تعديل':'إضافة', V.title, r.no||r.code||r.name||r.id, '');
  editId=null; persist(); render();
};

let tmpLines = [];
function lnWarnMsg(l){
  if(!l.product || !(+l.qty>0)) return '';
  const avail = stockQty(l.product);
  if(avail<=0) return 'تنبيه: هذا المنتج غير متوفر حالياً في المخزون — سيتم توريده عند الطلب';
  if(avail < +l.qty) return `تنبيه: المتوفر ${fmt(avail)} فقط من ${fmt(l.qty)} — الباقي يورَّد عند الطلب`;
  return '';
}
function linesHTML(priceMode){

    return `<tr>

    <td style="min-width:190px"><select onchange="lnProd(${i},this.value,'${priceMode}')"><option value=""></option>${optProducts().map(p=>`<option ${p===l.product?'selected':''}>${esc(p)}</option>`).join('')}</select>
      <div id="lw_${i}" style="color:var(--amber);font-size:10.5px;font-weight:700">${esc(w)}</div></td>
    <td id="lb_${i}" style="width:90px">${esc(l.brand||'—')}</td>
    <td style="width:70px"><input type="number" min="0" value="${l.qty??''}" oninput="lnSet(${i},'qty',this.value,'${priceMode}')"></td>
    <td style="width:95px"><input id="lp_${i}" readonly value="${fmt(l.defPrice)}" title="السعر الافتراضي من المنتجات"></td>
    <td style="width:95px"><input type="number" step="any" placeholder="تجاوز" value="${l.override??''}" oninput="lnSet(${i},'override',this.value,'${priceMode}')"></td>
    ${isQuote?`<td style="width:120px"><select id="ls_${i}" onchange="tmpLines[${i}].supplyType=this.value">
      ${['من المخزون','طلب خارجي'].map(s=>`<option ${s===(l.supplyType||'من المخزون')?'selected':''}>${s}</option>`).join('')}</select></td>`:''}
    <td id="lt_${i}" style="width:100px;font-weight:700">${fmt(lineTotal(l))}</td>
    <td class="no-print" style="width:30px"><button class="btn sm red" onclick="tmpLines.splice(${i},1);drawLines('${priceMode}')">✕</button></td></tr>`;}).join('');
  return `<div style="overflow-x:auto"><table class="linestable"><thead><tr><th>#</th><th>المنتج — Product</th><th>الماركة — Brand</th><th>الكمية — Quantity</th><th>سعر افتراضي — Default Price</th><th>سعر معتمد — Approved Price</th>${isQuote?'<th>التوريد — Supply Time</th>':''}<th>الإجمالي — Total</th><th class="no-print"></th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="btnrow"><button class="btn ghost sm" onclick="tmpLines.push({});drawLines('${priceMode}')">+ إضافة بند</button></div>`;
}
window.drawLines = pm => { document.getElementById('linesbox').innerHTML = linesHTML(pm); recalcDoc(pm); };
function lnRefreshWarn(i, pm){
  if(pm!=='price') return;
  const l = tmpLines[i];
  const msg = lnWarnMsg(l);
  const wEl = document.getElementById('lw_'+i); if(wEl) wEl.textContent = msg;
  // اقتراح تلقائي: نقص المخزون ← طلب خارجي (يبقى قابلاً للتعديل)
  if(msg && !l._supplyTouched){ l.supplyType = 'طلب خارجي'; const s=document.getElementById('ls_'+i); if(s) s.value='طلب خارجي'; }
}
window.lnProd = (i, name, pm) => {
  const p = S.products.find(x=>x.nameAr===name);
  tmpLines[i].product = name;
  tmpLines[i].brand = p?p.brand:'';
  tmpLines[i].defPrice = p ? (pm==='cost'? +p.cost : +p.price) : '';
  document.getElementById('lb_'+i).textContent = tmpLines[i].brand||'—';
  document.getElementById('lp_'+i).value = fmt(tmpLines[i].defPrice);
  lnRefreshWarn(i, pm);
  recalcDoc(pm);
};
window.lnSet = (i,k,v,pm) => { tmpLines[i][k]=v; document.getElementById('lt_'+i).textContent = fmt(lineTotal(tmpLines[i])); if(k==='qty') lnRefreshWarn(i, pm); recalcDoc(); };
function recalcDoc(){
  const disc = +(document.getElementById('f_disc')?.value||0);
  const g = tmpLines.reduce((a,l)=>a+lineTotal(l),0);
  const d = g*disc/100, net=g-d, vat=net*0.15, tot=net+vat;
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=fmt(v);};
  set('t_gross',g); set('t_disc',d); set('t_net',net); set('t_vat',vat); set('t_total',tot);
  const al = document.getElementById('docalert');
  if(al){
    const limit = al.dataset.limit==='po' ? tot>50000 : (tot>20000 || disc>5);
    const msg = al.dataset.limit==='po' ? '⚠ يتجاوز 50,000 ريال — يتطلب توقيع الشريكين معاً — Exceeds SAR 50,000: requires signatures from both partners' : '⚠ يتطلب اعتماد المدير العام (الإجمالي > 20,000 أو الخصم > 5%)';
    al.style.display = limit?'block':'none'; al.textContent = msg;
  }
  return {g,d,net,vat,tot};
}
window.recalcDoc = recalcDoc;

window.saveQuote = () => {

  const t = recalcDoc();
  const row = editId ? {...S.quotes.find(q=>q.id===editId)} : {id:uid(), no: nextNo('QUO')};
  Object.assign(row, {date:g('f_date'),customer:g('f_customer'),rep:g('f_rep'),validity:g('f_validity'),disc:g('f_disc'),
    pay:g('f_pay'),delivery:g('f_delivery'),warranty:g('f_warranty'),status:g('f_status'),terms:g('f_terms'),
    gross:t.g, net:t.net, vat:t.vat, total:t.tot});
  S.lines = S.lines.filter(l=>l.docNo!==row.no).concat(valid.map(l=>({id:l.id||uid(),docType:'SLS-001',docNo:row.no,product:l.product,brand:l.brand,qty:+l.qty,defPrice:l.defPrice,override:l.override||'',supplyType:l.supplyType||'من المخزون',extStatus:l.extStatus||''})));

  editId=null; tmpLines=[]; persist(); render();

window.exportBackup = () => {
  const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mini_erp_backup_'+today()+'.json';
  a.click();
};
window.importBackup = inp => {
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { try{
    if(!isAdmin()) return alert('استيراد النسخ الاحتياطية صلاحية مدير فقط');
    const d = JSON.parse(rd.result);
    if(!d || typeof d!=='object' || !Array.isArray(d.products) || !Array.isArray(d.quotes)) return alert('الملف ليس نسخة احتياطية صالحة من هذا النظام');
    if(!confirm('استبدال كل البيانات الحالية بالنسخة المستوردة؟ لا يمكن التراجع.')) return;
    Object.assign(S,d); logAudit('استيراد نسخة احتياطية','النظام','', (f&&f.name)||''); persist(); render(); alert('تم الاستيراد');
  }catch(e){ alert('ملف غير صالح'); } };
  rd.readAsText(f);
};

     + pGrid([['مرجع طلب الشراء — Purchase Requisition Reference',p.prRef],['المورد — Supplier',p.supplier],['الدولة — Country',p.country],['شروط الدفع — Payment Terms',s.terms],['العملة — Currency',p.cur],['Incoterms',p.inc]])

     + `<div class="psec">الاعتمادات الإلكترونية — Electronic Approvals</div>` + pApprovals(p)
     + pSigs(['تأكيد المورد — Supplier Confirmation']) + pFoot();
  }
  if(t==='pr'){
    const p = S.prs.find(x=>x.no===no); if(!p) return '';
    const alert = +p.est>5000?`<div class="alertbox">⚠ يتجاوز 5,000 ريال — يتطلب توقيع الشريكين — Exceeds SAR 5,000: requires signatures from both partners</div>`:'';
    return pHead('PUR-001','طلب شراء — Purchase Requisition',no,p.date)
     + pGrid([['الطالب — Requester',p.requester],['السبب — Reason',p.reason],['مرجع أمر البيع — Sales Order Reference',p.soRef],['المورد المقترح — Suggested Supplier',p.supplier],['الحالة — Status',p.status]])
     + `<div class="psec">وصف الاحتياج — Requirement Description</div>` + pGrid([['الوصف — Description',p.desc],['التكلفة التقديرية — Estimated Cost',fmt(p.est)]])

     + `<div class="psec">الاعتمادات الإلكترونية — Electronic Approvals</div>` + pApprovals(p) + pFoot();
  }
  if(t==='ins'){
    const j = S.installjobs.find(x=>x.no===no); if(!j) return '';

     + pGrid([['المرجع — Reference',(j.refType||'')+' '+(j.ref||'')],['الوصف — Description',j.desc],['فريق التركيب — Installation Team',showMulti(j.crew)],['العدد المطلوب — Number Required',j.crewCount],['المبلغ المقبوض — Amount Received',fmt(j.amount)],['العهدة المرتبطة — Related Custody',j.custodyRef],['حالة التصفية — Settlement Status',j.settled],['حالة المهمة — Task Status',j.status]])
     + pSigs(['فريق التركيب — Installation Team','مشرف العمليات — Operations Supervisor','المالية — Finance']) + pFoot();
  }
  if(t==='payv'){
    const p = S.payments.find(x=>x.no===no); if(!p) return '';
    const q = S.quotes.find(x=>x.no===p.quoteRef)||{};

    return pHead('PAY','سند قبض — Receipt Voucher',no,p.date)
     + pGrid([['العميل — Customer',p.customer],['عرض السعر — Quotation',p.quoteRef],['طريقة الدفع — Payment Method',p.method],['المرجع/الشيك — Reference/Cheque',p.ref]])
     + pTotals([['قيمة العرض الإجمالية — Total Quote Value',q.total],['المبلغ المقبوض بهذا السند — Amount Received on This Voucher',p.amount],['إجمالي المسدَّد على العرض — Total Paid on Quote',quotePaid(p.quoteRef)],['المتبقي بعد هذا السند — Remaining After This Voucher',rem]])
     + pSigs(['المحاسب / أمين الصندوق — Accountant / Cashier','المستلم — Recipient','العميل — Customer']) + pFoot();
  }
  if(t==='pay'){
    const p = S.payroll.find(x=>x.no===no); if(!p) return '';
    const net = p.net!=null?p.net:((+p.base||0)+(+p.additions||0)-(+p.deductions||0));
    return pHead('FIN-002','أمر صرف راتب — Payroll Voucher',no,p.date)
     + pGrid([['الموظف — Employee',p.employee],['الشهر — Month',p.month],['طريقة الصرف — Disbursement Method',p.method],['الحالة — Status',p.status]])
     + pTotals([['الراتب الأساسي — Basic Salary',p.base],['إضافات/بدلات — Additions/Allowances',p.additions],['خصومات — Deductions',p.deductions],['صافي المستحق — Net Due',net]])
     + pSigs(['المحاسب — Accountant','المدير العام — General Manager','استلمت المبلغ (الموظف) — Amount Received (Employee)']) + pFoot();
  }
  return '';
}

/* ═══════════════ تقرير الضريبة الربعي ═══════════════ */
let vatY = new Date().getFullYear(), vatQ = qOf(today());
window.setVatQ = (y,q) => { vatY=y; vatQ=q; render(); };
function renderVAT(){
  const out = S.sos.filter(o=>o.status!=='ملغي' && inQ(o.date, vatY, vatQ));
  const inp = S.expenses.filter(e=>e.hasVat==='نعم' && inQ(e.date, vatY, vatQ));
  const oNet = out.reduce((a,o)=>a+(+o.total||0)/1.15,0);
  const oVat = out.reduce((a,o)=>a+((+o.total||0)-(+o.total||0)/1.15),0);
  const iVat = inp.reduce((a,e)=>a+expVat(e),0);
  const due = oVat - iVat;
  const qBtns = [1,2,3,4].map(q=>`<button class="btn sm ${q===vatQ?'':'ghost'}" onclick="setVatQ(${vatY},${q})">الربع ${q}</button>`).join('');
  document.getElementById('main').innerHTML = `
   ${headHtml('🧾 تقرير ضريبة القيمة المضافة — VAT Report','المحصلة من العملاء − ضريبة المدخلات من فواتير المصروفات = الصافي المستحق للهيئة / Collected from customers − input tax on expense invoices = net due to the authority')}
   <div class="card no-print"><div class="btnrow" style="align-items:center">
    <label style="font-weight:700;color:var(--steel)">السنة:</label>
    <input type="number" value="${vatY}" style="width:90px;padding:6px;border:1px solid var(--silver);border-radius:6px" onchange="setVatQ(+this.value,${vatQ})">
    ${qBtns}<button class="btn red sm" onclick="window.print()">🖨 طباعة التقرير</button></div></div>
   <div class="ptitle">تقرير ضريبة القيمة المضافة — الربع ${vatQ} / ${vatY}</div>
   <div class="kpis">
    <div class="kpi"><div class="lbl">الضريبة المحصلة من العملاء — Tax Collected from Customers</div><div class="val">${fmt(oVat)}</div></div>
    <div class="kpi"><div class="lbl">ضريبة المدخلات (المصروفات) — Input Tax (Expenses)</div><div class="val">${fmt(iVat)}</div></div>
    <div class="kpi ${due>=0?'warn':'good'}"><div class="lbl">${due>=0?'الصافي المستحق للهيئة — Net Due to Authority':'رصيد دائن (استرداد) — Credit Balance (Refund)'}</div><div class="val">${fmt(Math.abs(due))}</div></div>
   </div>
   <div class="card"><h3>أولاً: الضريبة المحصلة — فواتير المبيعات (أوامر البيع المؤكدة)</h3>
    <div style="overflow-x:auto"><table><thead><tr><th>رقم الفاتورة/الأمر — Invoice/Order No.</th><th>التاريخ — Date</th><th>العميل — Customer</th><th>الصافي قبل الضريبة — Net Before Tax</th><th>الضريبة 15% — VAT 15%</th><th>الإجمالي بعد الضريبة — Total After Tax</th></tr></thead><tbody>
    ${out.length?out.map(o=>{const n=(+o.total||0)/1.15;return `<tr><td><b>${esc(o.no)}</b></td><td>${esc(o.date)}</td><td>${esc(o.customer)}</td><td>${fmt(n)}</td><td>${fmt(o.total-n)}</td><td>${fmt(o.total)}</td></tr>`;}).join(''):'<tr><td colspan="6" class="empty">لا مبيعات في هذا الربع</td></tr>'}
    </tbody><tfoot><tr><td colspan="3" style="background:var(--light);font-weight:700;color:var(--navy)">إجمالي الربع</td><td style="font-weight:700">${fmt(oNet)}</td><td style="font-weight:700;color:var(--red)">${fmt(oVat)}</td><td style="font-weight:700">${fmt(oNet+oVat)}</td></tr></tfoot></table></div></div>
   <div class="card"><h3>ثانياً: ضريبة المدخلات — فواتير المصروفات الضريبية</h3>
    <div style="overflow-x:auto"><table><thead><tr><th>القيد — Entry</th><th>التاريخ — Date</th><th>التصنيف — Classification</th><th>رقم الفاتورة — Invoice No.</th><th>الصافي — Net</th><th>الضريبة 15% — VAT 15%</th><th>الإجمالي — Total</th></tr></thead><tbody>
    ${inp.length?inp.map(e=>`<tr><td>${esc(e.no)}</td><td>${esc(e.date)}</td><td>${esc(e.cat)}</td><td>${esc(e.invNo||'—')}</td><td>${fmt(expNet(e))}</td><td>${fmt(expVat(e))}</td><td>${fmt(e.amount)}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">لا فواتير مدخلات في هذا الربع</td></tr>'}
    </tbody><tfoot><tr><td colspan="4" style="background:var(--light);font-weight:700;color:var(--navy)">إجمالي الربع</td><td style="font-weight:700">${fmt(inp.reduce((a,e)=>a+expNet(e),0))}</td><td style="font-weight:700;color:var(--green)">${fmt(iVat)}</td><td style="font-weight:700">${fmt(inp.reduce((a,e)=>a+(+e.amount||0),0))}</td></tr></tfoot></table></div></div>
   <div class="card"><div class="totrow"><span>المحصلة: <b>${fmt(oVat)}</b></span><span>−</span><span>المدخلات: <b>${fmt(iVat)}</b></span><span>=</span><span>${due>=0?'المستحق للهيئة':'رصيد دائن'}: <b style="color:var(--red)">${fmt(Math.abs(due))}</b></span></div>
   <div class="alertbox" style="background:var(--light);color:var(--steel);border-right-color:var(--steel)">ℹ هذا التقرير تشغيلي داخلي لدعم الإقرار الربعي — الإقرار الرسمي يُقدَّم عبر منصة زاتكا ZATCA وتُراجَع أرقامه مع المحاسب.</div></div>`;
}

let payCust = '';

window.convertLead = id => {
  const L = S.leads.find(x=>x.id===id); if(!L) return;
  if(!confirm('تحويل «'+(L.companyName||L.name)+'» إلى حساب عميل + جهة اتصال + صفقة؟')) return;
  const coName = L.companyName || L.name;
  let cust = S.customers.find(c=>c.name===coName);
  if(!cust){
    const mk='MCUS'; S.counters[mk]=(S.counters[mk]||S.customers.length)+1;
    cust = {id:uid(), code:'CUS-'+String(S.counters[mk]).padStart(4,'0'), name:coName, contact:L.name,
            mobile:L.mobile, email:L.email, city:L.city, cls:'عميل محتمل', activity:L.activity, notes:'محوَّل من '+L.no, _u:today()};
    S.customers.push(cust);
  }
  if(L.name && !S.contacts.some(c=>c.name===L.name && c.account===coName)){
    const mk='MCNT'; S.counters[mk]=(S.counters[mk]||S.contacts.length)+1;
    S.contacts.push({id:uid(), code:'CNT-'+String(S.counters[mk]).padStart(4,'0'), name:L.name, account:coName, mobile:L.mobile, email:L.email, _u:today()});
  }
  const opp = {id:uid(), no:nextNo('OPP'), date:today(), name:'فرصة — '+coName, customer:coName,
    contact:L.name, stage:'مؤهل', value:'', prob:'40', closeDate:'', campaign:L.campaign||'', owner:L.owner||'', source:L.source||'', _u:today()};
  S.opps.push(opp);
  L.status='محوَّل'; L._u=today();
  logAudit('تحويل عميل محتمل','CRM', L.no, 'إلى حساب '+coName+' وصفقة '+opp.no);
  persist(); editId=opp.id; view='opps'; render();
};

window.oppDrag = (ev,id) => { ev.dataTransfer.setData('text/plain', id); };
window.oppDrop = (ev,stage) => {
  ev.preventDefault();
  const id = ev.dataTransfer.getData('text/plain');
  const o = S.opps.find(x=>x.id===id); if(!o||o.stage===stage) return;
  const old = o.stage; o.stage = stage; o._u = today();
  logAudit('تغيير مرحلة صفقة','CRM', o.no, old+' ← '+stage);
  persist(); render();
};
window.saveOpp = () => {
  const g = id => document.getElementById(id).value;
  if(!g('op_name')) return alert('اسم الصفقة مطلوب');
  if(!g('op_customer')) return alert('اختر العميل');
  if(g('op_value')!=='' && +g('op_value')<0) return alert('القيمة لا تقبل السالب');
  const row = editId ? {...S.opps.find(x=>x.id===editId)} : {id:uid(), no:nextNo('OPP')};
  Object.assign(row,{date:g('op_date'),name:g('op_name'),customer:g('op_customer'),contact:g('op_contact'),
    stage:g('op_stage'),value:g('op_value'),prob:g('op_prob'),closeDate:g('op_close'),
    campaign:g('op_campaign'),owner:g('op_owner'),_u:today()});
  if(editId){const i=S.opps.findIndex(x=>x.id===editId);S.opps[i]=row;}else S.opps.push(row);
  logAudit(editId?'تعديل':'إضافة','صفقة',row.no,row.stage);
  editId=null; persist(); render();
};
window.delOpp = id => { const o=S.opps.find(x=>x.id===id); if(!confirm('حذف الصفقة؟'))return;
  S.opps=S.opps.filter(x=>x.id!==id); logAudit('حذف','صفقة',o.no,''); editId=null; persist(); render(); };
window.goQuoteFromOpp = oppId => {
  const o = S.opps.find(x=>x.id===oppId); if(!o) return;
  if(o.quoteNo){ const q=S.quotes.find(x=>x.no===o.quoteNo); if(q){ editId=q.id; view='quotes'; tmpLines=[]; render(); return; } }
  const q = {id:uid(), no:nextNo('QUO'), date:today(), customer:o.customer, rep:o.owner||'', validity:15,
    disc:0, pay:'50% مقدم / 50% قبل التسليم', warranty:'12 شهراً', status:'مفتوح', oppRef:o.no,
    gross:0, net:0, vat:0, total:0, _u:today()};
  S.quotes.push(q);
  o.quoteNo = q.no; if(o.stage==='جديد'||o.stage==='مؤهل') o.stage='عرض سعر'; o._u=today();
  logAudit('إنشاء عرض من صفقة','CRM', o.no, q.no);
  persist(); editId=q.id; view='quotes'; tmpLines=[]; render();
};

      [['الاسم','name'],['الشركة','companyName'],['الجوال','mobile'],['الحالة','status']],
      r=>`editId='${r.id}';setView('leads')`);
    out += sec('👔 جهات اتصال', S.contacts.filter(c=>match(c.name)||match(c.mobile)||match(c.account)),
      [['الاسم','name'],['الشركة','account'],['الجوال','mobile']],
      r=>`editId='${r.id}';setView('contacts')`);
    out += sec('🗂 صفقات', S.opps.filter(o=>match(o.name)||match(o.customer)||match(o.no)),
      [['الرقم','no'],['الاسم','name'],['العميل','customer'],['المرحلة','stage']],
      r=>`editId='${r.id}';setView('opps')`);
    out += sec('📄 عروض أسعار', S.quotes.filter(x=>match(x.no)||match(x.customer)),
      [['الرقم','no'],['العميل','customer'],['الإجمالي',r=>fmt(r.total)],['الحالة','status']],
      r=>`editId='${r.id}';setView('quotes')`);
    out += sec('🎫 تذاكر', S.tickets.filter(t=>match(t.subject)||match(t.account)||match(t.no)),
      [['الرقم','no'],['العميل','account'],['الموضوع','subject'],['الحالة','status']],
      r=>`editId='${r.id}';setView('tickets')`);

  } else out = '<div class="empty">اكتب حرفين على الأقل للبحث في: العملاء، المحتملين، جهات الاتصال، الصفقات، عروض الأسعار، التذاكر</div>';

}

window.approve = (key, id, role) => {
  const ent = VIEWS[key] ? VIEWS[key].ent : key; // يدعم quotes/pos أيضاً
  const rec = (S[ent]||S[key]||[]).find(r=>r.id===id) || (S.quotes.concat(S.pos)).find(r=>r.id===id);
  if(!rec) return;
  if(role==='manager' && !canApproveMgr()){ alert('لا تملك صلاحية اعتماد المدير'); return; }
  if(!rec.approvals) rec.approvals = {};
  const undo = rec.approvals[role] && rec.approvals[role].by;
  if(undo){ rec.approvals[role] = null; }
  else { rec.approvals[role] = { by: curName(), at: new Date().toLocaleString('en-GB',{hour12:false}).replace(',','') }; }
  logAudit(undo?'إلغاء اعتماد':'اعتماد إلكتروني', role==='manager'?'اعتماد مدير':'اعتماد مندوب', rec.no||rec.id, '');
  persist(); render();
};

      <td>${scope}${x.approveManager&&!x.admin?' <span class="tag ok">اعتماد مدير</span>':''}</td>
      <td>${x.enabled===false?'<span class="tag warn">موقوف</span>':'<span class="tag ok">نشط</span>'}</td>
      <td class="no-print">
        <button class="btn sm ghost" onclick="editUserRow('${x.id}')">تعديل</button>
        <button class="btn sm ghost" onclick="resetUserPass('${x.id}')">إعادة تعيين كلمة السر</button>
        ${x.admin?'':`<button class="btn sm ghost" onclick="toggleUser('${x.id}')">${x.enabled===false?'تفعيل':'إيقاف'}</button>`}
      </td></tr>`;
  }).join('');
  document.getElementById('main').innerHTML = `
   ${headHtml('👤 المستخدمون والصلاحيات — Users & Permissions','إضافة مستخدمين وتحديد صلاحياتهم. الشريكان مديران بصلاحية كاملة. / Add users and set their permissions. Both partners are full-access admins.')}
   <div class="card"><h3>${editing?'تعديل مستخدم: '+esc(editing.email):'إضافة مستخدم جديد'}</h3>
    <div class="formgrid">
     <div class="fld"><label>الاسم — Name *</label><input id="u_name" value="${esc(u.name||'')}"></div>
     <div class="fld"><label>البريد الإلكتروني — Email *</label><input id="u_email" type="email" value="${esc(u.email||'')}" ${editing?'readonly':''}></div>
     ${editing?'':`<div class="fld"><label>كلمة مرور مؤقتة — Temporary Password *</label><input id="u_pass" value="${genPass()}"></div>`}
     <div class="fld"><label>الجوال — Mobile</label><input id="u_mobile" value="${esc(u.mobile||'')}"></div>
     <div class="fld"><label>المنصب/الوصف — Position/Description</label><input id="u_title" value="${esc(u.title||'')}"></div>
     <div class="fld"><label>الصورة — Image</label><input type="hidden" id="f_uphoto" value="${esc(u.photo||'')}"><div id="pv_uphoto" style="margin-bottom:6px">${u.photo?`<img src="${window.media.src(u.photo)||''}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--silver)">`:''}</div><input type="file" accept="image/*" onchange="onImgPick(this,'f_uphoto','pv_uphoto')"></div>
    </div>
    <div class="fld" style="max-width:280px;margin-bottom:8px"><label>الدور الوظيفي (يُعبّئ الصلاحيات تلقائياً) — Job Role (Auto-fills Permissions)</label>
     <select id="u_role" onchange="applyRolePreset(this.value)"><option value=""></option>${Object.keys(ROLE_PRESETS).map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px">
     <label style="font-weight:700"><input type="checkbox" id="u_admin" ${u.admin?'checked':''} onchange="document.getElementById('permbox').style.display=this.checked?'none':'block'"> مدير (صلاحية كاملة)</label>
     <label style="font-weight:700"><input type="checkbox" id="u_ro" ${u.readOnly?'checked':''}> استعراض فقط (بدون تعديل)</label>
     <label style="font-weight:700"><input type="checkbox" id="u_mgr" ${u.approveManager?'checked':''}> صلاحية اعتماد المدير</label>
    </div>
    <div id="permbox" class="card" style="background:var(--pale);display:${checkAll?'none':'block'}"><h3>الشاشات المسموح بها</h3>
     <div style="display:flex;flex-wrap:wrap;gap:8px 16px">
      ${PERM_VIEWS.map(([k,l])=>`<label style="font-size:12.5px;font-weight:400"><input type="checkbox" class="permchk" value="${k}" ${uViews.includes(k)||uViews.includes('all')?'checked':''}> ${l}</label>`).join('')}
     </div><div style="font-size:11.5px;color:var(--steel);margin-top:6px">لوحة التحكم وصفحة «حسابي» متاحة للجميع دائماً.</div></div>
    <div class="btnrow"><button class="btn" onclick="saveUser()">${editing?'حفظ التعديل':'➕ إنشاء المستخدم'}</button>
     ${editing?`<button class="btn ghost" onclick="editId=null;render()">إلغاء</button>`:''}</div>
    <div id="u_msg" style="margin-top:8px;font-size:12.5px"></div>
   </div>
   <div class="card"><h3>المستخدمون (${S.users.length})</h3>
    <div style="overflow-x:auto"><table><thead><tr><th>صورة — Image</th><th>الاسم — Name</th><th>البريد — Email</th><th>الصلاحيات — Permissions</th><th>الحالة — Status</th><th class="no-print"></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function genPass(){ return 'Erp' + Math.random().toString(36).slice(2,8) + '!' + Math.floor(Math.random()*90+10); }
window.applyRolePreset = role => {
  const p = ROLE_PRESETS[role];
  if(!p) return; // «مخصص» أو فارغ — لا تغيير
  document.getElementById('u_admin').checked = p.admin;
  document.getElementById('permbox').style.display = p.admin ? 'none' : 'block';
  document.querySelectorAll('.permchk').forEach(c=>{ c.checked = p.views.includes('all') || p.views.includes(c.value); });
};
function readUserForm(){
  const admin = document.getElementById('u_admin').checked;
  const views = admin ? ['all'] : [...document.querySelectorAll('.permchk')].filter(c=>c.checked).map(c=>c.value);
  return {
    name: document.getElementById('u_name').value.trim(),
    email: document.getElementById('u_email').value.trim().toLowerCase(),
    mobile: document.getElementById('u_mobile').value.trim(),
    title: document.getElementById('u_title').value.trim(),
    photo: document.getElementById('f_uphoto').value,
    role: document.getElementById('u_role').value,
    admin, readOnly: document.getElementById('u_ro').checked,
    approveManager: admin || document.getElementById('u_mgr').checked,
    views
  };
}
window.editUserRow = id => { editId=id; render(); window.scrollTo(0,0); };
window.toggleUser = id => { const u=S.users.find(x=>x.id===id); if(!u||u.admin) return; u.enabled = u.enabled===false; persist(); render(); };
window.resetUserPass = async id => {
  const u = S.users.find(x=>x.id===id); if(!u) return;
  if(!confirm('إرسال رابط إعادة تعيين كلمة المرور إلى '+u.email+'؟')) return;
  try{ await window.authApi.sendReset(u.email); alert('تم إرسال رابط إعادة التعيين إلى '+u.email); }
  catch(e){ alert('تعذّر الإرسال: '+e.message); }
};
window.saveUser = async () => {
  const msg = document.getElementById('u_msg');
  const f = readUserForm();
  if(!f.name){ alert('الاسم مطلوب'); return; }
  if(!f.email){ alert('البريد الإلكتروني مطلوب'); return; }
  if(editId){
    const i = S.users.findIndex(x=>x.id===editId);
    S.users[i] = {...S.users[i], ...f};
    editId=null; persist(); render(); return;
  }
  // مستخدم جديد: أنشئ حساب فايربيس دون التأثير على جلسة المدير
  const pass = document.getElementById('u_pass').value;
  if(!pass || pass.length<6){ alert('كلمة المرور يجب أن تكون 6 أحرف على الأقل'); return; }
  msg.innerHTML = '<span style="color:var(--steel)">جارِ إنشاء الحساب...</span>';
  try{
    const uid2 = await window.authApi.createUser(f.email, pass);
    S.users.push({id:uid(), uid:uid2, enabled:true, ...f});
    persist();
    msg.innerHTML = `<div class="alertbox" style="background:#e6f4ea;color:var(--green);border-right-color:var(--green)">✔ تم إنشاء المستخدم <b>${esc(f.email)}</b> — كلمة المرور المؤقتة: <b>${esc(pass)}</b> (سلّمها للمستخدم، ويمكنه تغييرها من «حسابي»).</div>`;
    setTimeout(()=>{ render(); }, 4000);
  }catch(e){
    const m = e.code==='auth/email-already-in-use' ? 'هذا البريد مستخدم مسبقاً' : (e.code==='auth/invalid-email'?'بريد غير صالح':e.message);
    msg.innerHTML = `<span style="color:var(--red)">تعذّر الإنشاء: ${esc(m)}</span>`;
  }
};

/* ═══════════════ صفحة «حسابي» — تغيير كلمة المرور ═══════════════ */
function renderAccount(){
  const au = window.authUser || {};
  const u = currentUser() || {};
  document.getElementById('main').innerHTML = `
   ${headHtml('🔑 حسابي — My Account','تعديل كلمة المرور الخاصة بك / Change your password')}
   <div class="card"><h3>معلوماتي</h3>
    <div style="display:flex;align-items:center;gap:12px">${imgTag(u.photo,52)}
     <div><div style="font-weight:700;color:var(--navy)">${esc(u.name||au.email||'')}</div>
     <div style="font-size:12px;color:var(--steel)">${esc(au.email||'')} ${u.admin?'— مدير':''}</div></div></div></div>
   <div class="card"><h3>⚙️ تفضيلاتي</h3><div class="formgrid" style="max-width:520px">
    <div class="fld"><label>عرض أسماء المنتجات — Show Product Names</label>
     <select id="pref_lang" onchange="savePrefLang(this.value)">
      ${[['both','عربي + إنجليزي معاً'],['ar','عربي فقط'],['en','إنجليزي فقط']].map(([v2,l2])=>`<option value="${v2}" ${prodLangPref()===v2?'selected':''}>${l2}</option>`).join('')}
     </select></div>
   </div>
   <div style="font-size:11.5px;color:var(--steel)">يُحفظ التفضيل في حسابك بالسحابة ويُطبَّق فوراً على كل الشاشات والمستندات.</div></div>
   <div class="card"><h3>تغيير كلمة المرور</h3><div class="formgrid" style="max-width:520px">
    <div class="fld"><label>كلمة المرور الحالية — Current Password</label><input id="cp_old" type="password"></div>
    <div class="fld"><label>كلمة المرور الجديدة — New Password</label><input id="cp_new" type="password"></div>
    <div class="fld"><label>تأكيد كلمة المرور الجديدة — Confirm New Password</label><input id="cp_new2" type="password"></div>
   </div>
   <div class="btnrow"><button class="btn" onclick="changeMyPass()">حفظ كلمة المرور</button></div>
   <div id="cp_msg" style="margin-top:8px;font-size:12.5px"></div></div>`;
}
window.savePrefLang = v => {
  const rec = S.users.find(x=>x.uid===(window.authUser||{}).uid)
           || S.users.find(x=>(x.email||'').toLowerCase()===((window.authUser||{}).email||'').toLowerCase());
  if(rec){ rec.prodLang = v; persist(); render(); }
};
window.changeMyPass = async () => {
  const msg = document.getElementById('cp_msg');
  const oldP = document.getElementById('cp_old').value;
  const n1 = document.getElementById('cp_new').value, n2 = document.getElementById('cp_new2').value;
  if(n1.length<6){ msg.innerHTML='<span style="color:var(--red)">كلمة المرور الجديدة 6 أحرف على الأقل</span>'; return; }
  if(n1!==n2){ msg.innerHTML='<span style="color:var(--red)">كلمتا المرور غير متطابقتين</span>'; return; }
  try{
    await window.authApi.changeMyPassword(oldP, n1);
    msg.innerHTML='<span style="color:var(--green)">✔ تم تغيير كلمة المرور بنجاح</span>';
    document.getElementById('cp_old').value=document.getElementById('cp_new').value=document.getElementById('cp_new2').value='';
  }catch(e){
    const m = (e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')?'كلمة المرور الحالية غير صحيحة':e.message;
    msg.innerHTML='<span style="color:var(--red)">تعذّر التغيير: '+esc(m)+'</span>';
  }
};

/* ═══════════════ تقرير الرواتب ═══════════════ */
window.printPayrollReport = () => {
  const mon = prompt('اكتب الشهر بصيغة YYYY-MM لطباعة تقريره (اتركه فارغاً لكل السجلات):', today().slice(0,7));
  if(mon===null) return;
  const rows = S.payroll.filter(p=> !mon || (p.month||'')===mon);
  const net = p => p.net!=null?p.net:((+p.base||0)+(+p.additions||0)-(+p.deductions||0));
  const tot = rows.reduce((a,p)=>a+net(p),0);
  const totBase = rows.reduce((a,p)=>a+(+p.base||0),0);
  const totAdd = rows.reduce((a,p)=>a+(+p.additions||0),0);
  const totDed = rows.reduce((a,p)=>a+(+p.deductions||0),0);
  const docHtml =
    pHead('FIN-002','تقرير الرواتب — Payroll Report','تقرير','الشهر: '+(mon||'الكل'))
    + `<table style="margin-top:8px"><thead><tr><th>#</th><th>الموظف — Employee</th><th>الشهر — Month</th><th>الأساسي — Basic</th><th>إضافات — Additions</th><th>خصومات — Deductions</th><th>الصافي — Net</th><th>الحالة — Status</th></tr></thead><tbody>
      ${rows.length?rows.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.employee)}</td><td>${esc(p.month||'')}</td><td>${fmt(p.base)}</td><td>${fmt(p.additions)}</td><td>${fmt(p.deductions)}</td><td><b>${fmt(net(p))}</b></td><td>${esc(p.status||'')}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">لا سجلات</td></tr>'}
      </tbody><tfoot><tr><td colspan="3" style="background:var(--light);font-weight:700;color:var(--navy)">الإجمالي — ${rows.length} موظف</td><td style="font-weight:700">${fmt(totBase)}</td><td style="font-weight:700">${fmt(totAdd)}</td><td style="font-weight:700">${fmt(totDed)}</td><td style="font-weight:700;color:var(--red)">${fmt(tot)}</td><td></td></tr></tfoot></table>`
    + pSigs(['المحاسب — Accountant','المدير العام — General Manager']) + pFoot();
  const acts = `<button class="btn red sm no-print" onclick="window.print()">🖨 طباعة / حفظ PDF</button> <button class="btn ghost sm no-print" onclick="setView('payroll')">رجوع</button>`;
  document.getElementById('main').innerHTML =
    `${headHtml('💰 تقرير الرواتب — Payroll Report','الشهر — Month: '+(mon||'الكل — All'), acts)}
     <div id="printdoc">${docHtml}</div>`;
  setTimeout(()=>window.print(), 300);
};

/* ═══════════════ الموجه والتهيئة ═══════════════ */
function render(){
  renderNav();
  if(view==='dash') return renderDash();
  if(view==='company') return isAdmin()?renderCompany():renderDash();
  if(view==='users') return isAdmin()?renderUsers():renderDash();
  if(view==='audit') return isAdmin()?renderAudit():renderDash();
  if(view==='account') return renderAccount();
  if(view==='quotes') return renderQuotes();
  if(view==='sos') return renderSOs();
  if(view==='dos') return renderDOs();
  if(view==='pos') return renderPOs();
  if(view==='inventory') return renderInventory();
  if(view==='vat') return renderVAT();
  if(view==='print') return renderPrint();
  if(view==='opps') return renderOpps();
  if(view==='crmdash') return renderCRMDash();
  if(view==='search') return renderSearch();
  if(view==='ar') return renderAR();
  if(view==='external') return renderExternal();
  if(view==='reports') return renderReports();
  if(view==='notifs') return renderNotifs();
  if(VIEWS[view]) return renderRegister(view);
  renderDash();
}
window.addEventListener('erp-auth-ready', () => { loadState().then(()=>{ render(); }); });




</script>
